apiVersion: v1
kind: Service
metadata:
  name: image-api
  namespace: image-api
  labels:
    app: image-api
spec:
  type: ClusterIP
  selector:
    app: image-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
---
# NodePort service for local development/testing
apiVersion: v1
kind: Service
metadata:
  name: image-api-nodeport
  namespace: image-api
  labels:
    app: image-api
spec:
  type: NodePort
  selector:
    app: image-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
